name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify OSS PoF readiness
        run: pnpm pof:check
      - name: Verify NocoBase plugin contracts and script tests
        run: node --test plugins/nocobase/plugin-lattice-foundation/tests/*.test.cjs plugins/nocobase/action-bridge/tests/*.test.cjs plugins/nocobase/plugin-enterprise-auth/tests/*.test.cjs plugins/nocobase/plugin-dxos-para/tests/*.test.cjs plugins/nocobase/plugin-dxos-blocks/tests/*.test.cjs plugins/nocobase/plugin-dxos-studio/tests/*.test.cjs scripts/tests/*.test.mjs
