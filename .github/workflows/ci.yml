name: Check
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify Apache-2.0 SPDX headers
        run: node scripts/source-headers.mjs --check
      - name: Verify OSS PoF readiness
        run: pnpm pof:check
      - name: Verify CycloneDX SBOM freshness
        run: pnpm release:sbom -- --check
      - name: Verify Vietnamese NL Agent evaluation (>=95% pass)
        run: node scripts/eval-vietnamese-nl-agent.mjs --min-pass=95
      - name: Verify brand naming hygiene
        run: |
          set -euo pipefail
          BRAND_TERM="$(printf 'co%s' 'pilot')"
          if git grep -in "$BRAND_TERM" -- . ':!docs/superpowers/*'; then
            echo "Forbidden legacy brand term detected outside docs/superpowers/*" >&2
            exit 1
          fi
      - name: Verify NocoBase plugin contracts and script tests
        run: >-
          node --test
          plugins/nocobase/plugin-lattice-foundation/tests/*.test.cjs
          plugins/nocobase/action-bridge/tests/*.test.cjs
          plugins/nocobase/plugin-enterprise-auth/tests/*.test.cjs
          plugins/nocobase/plugin-dxos-para/tests/*.test.cjs
          plugins/nocobase/plugin-dxos-blocks/tests/*.test.cjs
          plugins/nocobase/plugin-dxos-studio/tests/*.test.cjs
          plugins/nocobase/plugin-dxos-ai/tests/*.test.cjs
          scripts/tests/*.test.mjs
          tests/native-ui-fixture.test.mjs
          tests/nocobase-externals.test.mjs

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies for moderate/high/critical vulnerabilities
        run: pnpm audit --prod --audit-level=moderate
      - name: Audit production dependencies for low+ vulnerabilities (PoF Championship gate)
        run: pnpm audit --prod --audit-level=low

  compose-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate all Docker Compose stacks
        run: |
          set -euo pipefail
          docker compose -f infra/compose/core.yml config --quiet
          docker compose -f infra/compose/nocobase.yml config --quiet
          docker compose -f infra/compose/native-rehearsal.yml config --quiet
          N8N_ENCRYPTION_KEY=ci-dummy-n8n-key docker compose -f infra/compose/integration.yml config --quiet
          DX_NATIVE_FILES_INSTANCE=ci-dummy \
          DX_NATIVE_FILES_SECRET=ci-dummy-secret \
          DX_NATIVE_ATTACHMENT_SUBMIT_ORGANIZATION=org-a \
            docker compose -f infra/compose/core.yml -f infra/compose/nocobase.yml -f infra/compose/native-files.yml config --quiet
          UC1_SAMPLE_TOKEN=ci-dummy-uc1-token \
            docker compose -f infra/compose/core.yml -f infra/compose/uc1-sample.yml config --quiet
          docker compose -f infra/compose/iiot.yml config --quiet
          docker compose --env-file infra/compose/prod.env.example -f infra/compose/prod.yml --profile observability --profile pdf config --quiet
          docker compose --env-file infra/compose/prod.env.example -f infra/compose/prod.yml --profile n8n --profile iiot --profile observability --profile pdf --profile iam-sync config --quiet

  trivy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run Trivy vulnerability, misconfiguration, and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: 'upstream'
