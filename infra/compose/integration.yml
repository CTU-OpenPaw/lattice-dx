name: lattice-dx

services:
  orion-mongo:
    # Service orion-mongo
    image: mongo:4.4.29@sha256:52c42cbab240b3c5b1748582cc13ef46d521ddacae002bbbda645cebed270ec0
    restart: unless-stopped
    volumes:
      - orion-mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongo
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 20

  orion-ld:
    # Service orion-ld
    image: fiware/orion-ld:1.10.0@sha256:3c490a746f6596e24875b046719b97fa5ede39cbb364e3c93d144de2f00898dc
    command: ["-dbhost", "orion-mongo", "-logLevel", "INFO"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1026:1026"
    depends_on:
      orion-mongo:
        condition: service_healthy

  n8n:
    # Service n8n
    image: n8nio/n8n:2.42.7@sha256:906dd7fb0a2f23869001d1767168359489c518ff34d4f67427abf2dc59e868fe
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  orion-mongo-data:
    # Recovery may select a verified replacement volume; the original stays intact.
    name: ${ORION_MONGO_VOLUME:-${COMPOSE_PROJECT_NAME}_orion-mongo-data}
  n8n-data:
