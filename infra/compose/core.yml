name: lattice-dx

x-local-defaults: &local_defaults
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *local_defaults
    image: postgres:16.16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_DB: lattice
      POSTGRES_USER: lattice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../config/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lattice -d lattice"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    <<: *local_defaults
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: lattice
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-password}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../config/keycloak/lattice-realm.json:/opt/keycloak/data/import/lattice-realm.json:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 || exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    <<: *local_defaults
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: postgres://lattice:${POSTGRES_PASSWORD:-local-demo-password}@postgres:5432/lattice
      OIDC_ISSUER: http://localhost:8081/realms/lattice
      OIDC_JWKS_URL: http://keycloak:8080/realms/lattice/protocol/openid-connect/certs
      OIDC_AUDIENCE: dx-api
      CLAMD_HOST: clamav
      WORKFLOW_EVENT_URL: ${WORKFLOW_EVENT_URL:-}
      WORKFLOW_EVENT_TOKEN: ${WORKFLOW_EVENT_TOKEN:-}
      WORKFLOW_OUTBOX_EVENT_TYPE: ${WORKFLOW_OUTBOX_EVENT_TYPE:-}
      WORKFLOW_OUTBOX_CREATED_AFTER: ${WORKFLOW_OUTBOX_CREATED_AFTER:-}
      WORKFLOW_OUTBOX_ORGANIZATION_ID: ${WORKFLOW_OUTBOX_ORGANIZATION_ID:-}
      NGSI_LD_CONTEXT_READ: ${NGSI_LD_CONTEXT_READ:-false}
      NGSI_LD_NOTIFICATION_TOKEN: ${NGSI_LD_NOTIFICATION_TOKEN:-}
      NGSI_LD_TENANT: ${NGSI_LD_TENANT:-org-a}
      NGSI_LD_SUBSCRIPTION_ID: ${NGSI_LD_SUBSCRIPTION_ID:-}
      ASSET_HANDOVER_TOKEN: ${ASSET_HANDOVER_TOKEN:-}
      ASSET_HANDOVER_BROKER_URL: ${ASSET_HANDOVER_BROKER_URL:-http://orion-ld:1026}
      ENTITY_AUTOMATION_WORKER: ${ENTITY_AUTOMATION_WORKER:-false}
      WORKFLOW_TIMER_WORKER: ${WORKFLOW_TIMER_WORKER:-false}
      WORKFLOW_WAIT_TIMEOUT_WORKER: ${WORKFLOW_WAIT_TIMEOUT_WORKER:-false}
      WORKFLOW_OUTBOX_WORKER: ${WORKFLOW_OUTBOX_WORKER:-false}
      FILE_STORAGE_PROVIDER: ${FILE_STORAGE_PROVIDER:-postgres}
      FILE_STORAGE_ROOT: /var/lib/latticedx/objects
      FILE_STORAGE_WORKER: ${FILE_STORAGE_WORKER:-false}
    volumes:
      - engine-objects:/var/lib/latticedx/objects
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    <<: *local_defaults
    image: apache/apisix:3.19.0-debian@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141
    volumes:
      - ../config/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../config/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "127.0.0.1:8080:9080"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_started
    mem_limit: 512m

  clamav:
    <<: *local_defaults
    image: clamav/clamav:1.5.5@sha256:12177441d1b40cef3c47b44c4090d59d4babc4c67bedd5af0fa315e603aa6dd8
    volumes:
      - clamav-signatures:/var/lib/clamav
    # Internal only: clamd is not an authenticated public API.
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  postgres-data:
  clamav-signatures:
  engine-objects:
