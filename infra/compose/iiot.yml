name: lattice-dx

x-iiot-defaults: &iiot_defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  iiot-net:
    driver: bridge
    internal: true

services:
  mosquitto:
    <<: *iiot_defaults
    # EPL-2.0 OSI-clean MQTT edge broker (strictly internal on iiot-net; bridge external sensors via authenticated edge gateway)
    image: eclipse-mosquitto:2.0.21@sha256:94f5a3d7deafa59fa3440d227ddad558f59d293c612138de841eec61bfa4d353
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    expose:
      - "1883"
    volumes:
      - ../config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - iiot-net
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nodered:
    <<: *iiot_defaults
    # Apache-2.0 OSI-clean IIoT protocol normalization & edge sanitizer
    image: nodered/node-red:4.0.9@sha256:0b295b3a14c512548567ca99db631bc37b23bfc79fd009ee8248a610fafdb4b5
    environment:
      TZ: Asia/Ho_Chi_Minh
      DX_IIOT_INGEST_URL: ${DX_IIOT_INGEST_URL:-http://nocobase/api/dxosBlocks:telemetryIngest}
      DX_IIOT_INGEST_TOKEN: ${DX_IIOT_INGEST_TOKEN:-}
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - nodered-data:/data
      - ../config/nodered/flows.json:/data/flows.json:ro
    networks:
      - iiot-net
      - default
    depends_on:
      mosquitto:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1880/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15

  timescaledb:
    <<: *iiot_defaults
    # Apache-2.0 OSS variant time-series Postgres extension store
    image: timescale/timescaledb:2.19.3-pg16-oss@sha256:769f2b43c7dac8e50887de2b49aff971dc5a8cf4aedfe2045d8b77eca2924a72
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      POSTGRES_DB: ${IIOT_TSDB_NAME:-lattice_iiot}
      POSTGRES_USER: ${IIOT_TSDB_USER:-lattice_iiot}
      POSTGRES_PASSWORD: ${IIOT_TSDB_PASSWORD:-local-iiot-tsdb-password}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    networks:
      - iiot-net
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mosquitto-data:
  mosquitto-log:
  nodered-data:
  timescaledb-data:
