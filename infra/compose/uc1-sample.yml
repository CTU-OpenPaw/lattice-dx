# SPDX-License-Identifier: Apache-2.0
services:
  uc1-sample:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command:
      - pnpm
      - --filter
      - "@dx/api"
      - exec
      - tsx
      - src/uc1-sample/server.ts
    environment:
      DATABASE_URL: postgres://lattice:local-demo-password@postgres:5432/lattice
      UC1_SAMPLE_TOKEN: ${UC1_SAMPLE_TOKEN:?Set UC1_SAMPLE_TOKEN in .env.integration}
      UC1_SAMPLE_TENANT: ${UC1_SAMPLE_TENANT:-org-a}
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20