name: lattice-dx

x-local-defaults: &local_defaults
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nocobase-db:
    <<: *local_defaults
    image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_DB: nocobase
      POSTGRES_USER: nocobase
      POSTGRES_PASSWORD: ${NOCOBASE_DB_PASSWORD:-local-nocobase-password}
    volumes:
      - nocobase-db-data:/var/lib/postgresql/data
      - ../config/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/001-pgvector.sql:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocobase -d nocobase"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *local_defaults
    # BSD-3-Clause OSI-clean Redis-compatible in-memory cache/pubsub store (Valkey)
    image: valkey/valkey:8.1-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local-redis-password}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
    volumes:
      - redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  nocobase:
    <<: *local_defaults
    image: nocobase/nocobase:2.2.50@sha256:04b75164936e7314ef74d82844bc56c9f34ed7ff1ca976ca53ffac2d3c88d777
    init: true
    environment:
      APP_KEY: ${NOCOBASE_APP_KEY:-local-nocobase-app-key-public-fixture}
      ENCRYPTION_FIELD_KEY: ${NOCOBASE_ENCRYPTION_FIELD_KEY:-local-nocobase-encryption-public-fixture}
      DB_DIALECT: postgres
      DB_HOST: nocobase-db
      DB_PORT: 5432
      DB_DATABASE: nocobase
      DB_USER: nocobase
      DB_PASSWORD: ${NOCOBASE_DB_PASSWORD:-local-nocobase-password}
      TZ: Asia/Ho_Chi_Minh
      PUBSUB_ADAPTER: redis
      PUBSUB_ADAPTER_REDIS_URL: redis://:${REDIS_PASSWORD:-local-redis-password}@redis:6379/1
      CACHE_DEFAULT_STORE: redis
      CACHE_REDIS_URL: redis://:${REDIS_PASSWORD:-local-redis-password}@redis:6379/0
      DX_BRIDGE_ISSUER: http://localhost:8081/realms/lattice
      DX_BRIDGE_INTERNAL_ISSUER: http://keycloak:8080/realms/lattice
      DX_BRIDGE_GATEWAY_URL: http://gateway:9080
      DX_BRIDGE_CALLBACK_URL: http://localhost:13000/api/dxActions:callback
      DX_NATIVE_AUTH_ISSUER: http://localhost:8081/realms/lattice
      DX_NATIVE_AUTH_INTERNAL_ISSUER: http://keycloak:8080/realms/lattice
      DX_NATIVE_AUTH_ORIGIN: http://localhost:13000
      DX_NATIVE_AUTH_CLIENT_ID: dx-native
      DX_NATIVE_CONTEXT_BROKER_URL: http://orion-ld:1026
      DX_NATIVE_CONTEXT_AUTO_SYNC: "true"
      NOCOBASE_INTERNAL_URL: http://127.0.0.1
    volumes:
      - nocobase-storage:/app/nocobase/storage
      - ../../plugins/nocobase/action-bridge:/app/nocobase/node_modules/@latticedx/plugin-action-bridge:ro
      - ../../plugins/nocobase/plugin-lattice-foundation:/app/nocobase/node_modules/@latticedx/plugin-lattice-foundation:ro
      - ../../plugins/nocobase/plugin-enterprise-auth:/app/nocobase/node_modules/@latticedx/plugin-enterprise-auth:ro
      - ../../plugins/nocobase/plugin-dxos-para:/app/nocobase/node_modules/@latticedx/plugin-dxos-para:ro
      - ../../plugins/nocobase/plugin-dxos-blocks:/app/nocobase/node_modules/@latticedx/plugin-dxos-blocks:ro
      - ../../plugins/nocobase/plugin-dxos-studio:/app/nocobase/node_modules/@latticedx/plugin-dxos-studio:ro
      - ../../plugins/nocobase/plugin-dxos-ai:/app/nocobase/node_modules/@latticedx/plugin-dxos-ai:ro
    ports:
      - "127.0.0.1:13000:80"
    depends_on:
      nocobase-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1/api/app:getLang').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  nocobase-db-data:
  nocobase-storage:
  redis-data:
