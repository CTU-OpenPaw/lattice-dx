# PostgreSQL 16 PITR / WAL Archiving Base Configuration
# Enable with custom archive_command for WAL-G or pgBackRest in production:
#   wal-g:      archive_command = 'wal-g wal-push %p'
#   pgbackrest: archive_command = 'pgbackrest --stanza=latticedx archive-push %p'
wal_level = replica
archive_mode = on
archive_command = '/bin/sh /etc/postgresql/pitr-archive.sh %p %f' # Production override: 'wal-g wal-push %p' or 'pgbackrest --stanza=latticedx archive-push %p'
archive_timeout = 300
max_wal_senders = 4
wal_compression = on
wal_keep_size = 512MB
checkpoint_timeout = 10min
shared_preload_libraries = 'pg_stat_statements'
