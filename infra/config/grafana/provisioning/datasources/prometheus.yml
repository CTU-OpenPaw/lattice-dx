apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: latticedx-prom
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
