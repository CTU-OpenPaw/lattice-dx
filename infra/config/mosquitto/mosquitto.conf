# MQTT listener strictly internal to iiot-net (no host ports bound in iiot.yml)
listener 1883 0.0.0.0

# Internal iiot-net edge broker only; configure password_file + ACLs + TLS before bridging external gateways
allow_anonymous true

# Persistence for QoS 1/2 queued edge telemetry
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Bounded message safety limits
max_queued_messages 1000
max_packet_size 65536

# Clean structured container logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
