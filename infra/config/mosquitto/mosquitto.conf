# MQTT listener strictly internal to iiot-net (no host ports bound)
listener 1883 0.0.0.0

# Zero-Trust MQTT: disable anonymous connections and enforce per-tenant Dynamic Security ACLs
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Persistence for QoS 1/2 queued edge telemetry & LWT state
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Bounded message safety limits
max_queued_messages 1000
max_packet_size 65536

# Clean structured container logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
