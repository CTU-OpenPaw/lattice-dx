global_rules:
  - id: 1
    plugins:
      request-id:
        header_name: X-Request-Id
      response-rewrite:
        headers:
          set:
            Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"
            X-Content-Type-Options: "nosniff"
            X-Frame-Options: "SAMEORIGIN"
            Referrer-Policy: "strict-origin-when-cross-origin"
      cors:
        allow_origins: "${{LATTICE_ALLOWED_ORIGIN}}"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Role,X-Request-Id,X-Lattice-API-Key,X-Lattice-Edge-Token,X-DX-Edge-Token,X-Authenticator"
        allow_credential: true
        max_age: 3600

routes:
  - id: health
    priority: 100
    uris: [/health, /ready]
    plugins:
      proxy-rewrite:
        uri: "/api/dxos:health"
    upstream:
      type: roundrobin
      nodes:
        "nocobase:80": 1

  - id: dxos-public-paas
    priority: 90
    uris:
      - /api/dxos:health
      - /api/dxos:openapi
      - /api/dxos:asyncapi
      - /api/dxos:manifest
      - /api/dxos:sw.js
      - /api/dxosWms:publicTrack
    plugins:
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: redis
        redis_host: redis
        redis_port: 6379
        redis_password: "${{REDIS_PASSWORD}}"
    upstream:
      type: roundrobin
      nodes:
        "nocobase:80": 1

  - id: dxos-oidc-bridge
    priority: 80
    uris: [/api/dxos-oidc, /api/dxos-oidc/*]
    plugins:
      openid-connect:
        client_id: dx-gateway
        client_secret: "${{APISIX_OIDC_CLIENT_SECRET}}"
        discovery: "${{APISIX_OIDC_DISCOVERY}}"
        bearer_only: true
        use_jwks: true
        ssl_verify: true
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: redis
        redis_host: redis
        redis_port: 6379
        redis_password: "${{REDIS_PASSWORD}}"
    upstream:
      type: roundrobin
      nodes:
        "nocobase:80": 1

  - id: dxos-mcp
    priority: 80
    uris: [/api/dxos-mcp, /api/dxos-mcp/*]
    plugins:
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: redis
        redis_host: redis
        redis_port: 6379
        redis_password: "${{REDIS_PASSWORD}}"
    upstream:
      type: roundrobin
      nodes:
        "nocobase:80": 1
      timeout:
        connect: 6
        send: 600
        read: 600

  - id: dxos-telemetry-ingest
    priority: 80
    uris: [/api/dxosBlocks:telemetryIngest, /api/dxosBlocks:alarmIngest]
    plugins:
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: redis
        redis_host: redis
        redis_port: 6379
        redis_password: "${{REDIS_PASSWORD}}"
    upstream:
      type: roundrobin
      nodes:
        "nocobase:80": 1

  - id: dxos-core-api
    priority: 10
    uri: /api/*
    plugins:
      limit-count:
        count: 240
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: redis
        redis_host: redis
        redis_port: 6379
        redis_password: "${{REDIS_PASSWORD}}"
    upstream:
      type: roundrobin
      nodes:
        "nocobase:80": 1
      timeout:
        connect: 6
        send: 600
        read: 600
#END
