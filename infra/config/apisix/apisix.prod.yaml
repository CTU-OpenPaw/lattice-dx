global_rules:
  - id: 1
    plugins:
      request-id:
        header_name: X-Request-Id
      response-rewrite:
        headers:
          set:
            Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"
            X-Content-Type-Options: "nosniff"
            X-Frame-Options: "SAMEORIGIN"
            Referrer-Policy: "strict-origin-when-cross-origin"
      cors:
        allow_origins: "${{LATTICE_ALLOWED_ORIGIN}}"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Role,X-Request-Id"
        allow_credential: true
        max_age: 3600

routes:
  - id: system-studio
    uris: [/v1/system-drafts, /v1/system-drafts/*, /v1/system-apps, /v1/system-apps/*, /v1/studio/system-plan, /v1/systems, /v1/systems/*]
    methods: [GET, POST, PUT, DELETE]
    plugins:
      openid-connect:
        client_id: dx-gateway
        client_secret: "${{APISIX_OIDC_CLIENT_SECRET}}"
        discovery: "${{APISIX_OIDC_DISCOVERY}}"
        bearer_only: true
        use_jwks: true
        ssl_verify: true
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: redis
        redis_host: redis
        redis_port: 6379
        redis_password: "${{REDIS_PASSWORD}}"
    upstream:
      type: roundrobin
      nodes:
        "api:4000": 1

  - id: ngsi-ld-notifications
