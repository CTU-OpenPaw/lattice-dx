# All credentials below are PUBLIC LOCAL DEVELOPMENT FIXTURES.
routes:
  # Broker credential is verified by the API; this route does not use user JWT auth.
  - id: ngsi-ld-notifications
    uris: [/v1/integrations/ngsi-ld/notifications, /v1/integrations/ngsi-ld/context]
    methods: [GET, POST]
    plugins:
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      request-id:
        header_name: X-Request-Id
    upstream:
      type: roundrobin
      nodes:
        "api:4000": 1
  - id: health
    uri: /health
    upstream:
      type: roundrobin
      nodes:
        "api:4000": 1
  - id: records
    uris: [/v1/records, /v1/records/*, /v1/tasks, /v1/tasks/*, /v1/files, /v1/files/*, /v1/actions, /v1/actions/*, /v1/directory/people, /v1/directory/departments, /v1/workflow-blocks, /v1/logistics/orders, /v1/logistics/orders/*, /v1/workflow-drafts, /v1/workflow-drafts/*, /v1/workflow-definitions, /v1/workflow-bundles/export, /v1/workflow-bundles/validate, /v1/workflow-bundles/import, /v1/workflow-members/me, /v1/workflow-references, /v1/workflows, /v1/workflows/*, /v1/workflow-waits/*/complete]
    methods: [GET, POST]
    plugins:
      openid-connect:
        client_id: dx-gateway
        client_secret: local-gateway-secret
        discovery: http://keycloak:8080/realms/lattice/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
        ssl_verify: false
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      request-id:
        header_name: X-Request-Id
    upstream:
      type: roundrobin
      nodes:
        "api:4000": 1
  - id: workflow-draft-save
    uri: /v1/workflow-drafts/*
    methods: [PUT]
    plugins:
      openid-connect:
        client_id: dx-gateway
        client_secret: local-gateway-secret
        discovery: http://keycloak:8080/realms/lattice/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
        ssl_verify: false
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      request-id:
        header_name: X-Request-Id
    upstream:
      type: roundrobin
      nodes:
        "api:4000": 1
  - id: enterprise-data
    uris: [/v1/entity-schemas, /v1/entity-schemas/*, /v1/entities, /v1/entities/*]
    methods: [GET, POST, PUT, PATCH, DELETE]
    plugins:
      openid-connect:
        client_id: dx-gateway
        client_secret: local-gateway-secret
        discovery: http://keycloak:8080/realms/lattice/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
        ssl_verify: false
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      request-id:
        header_name: X-Request-Id
    upstream:
      type: roundrobin
      nodes:
        "api:4000": 1
#END

