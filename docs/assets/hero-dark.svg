<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="LatticeDX v0.4.2 — Open Enterprise Operating Platform">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent-bar-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F45D22"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="glow-orange-dark" cx="22%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#F45D22" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#F45D22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue-dark" cx="78%" cy="24%" r="45%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-teal-dark" cx="55%" cy="88%" r="45%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-dark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.9" opacity="0.65"/>
    </pattern>
    <clipPath id="card-clip-dark">
      <rect x="2" y="2" width="1196" height="316" rx="20"/>
    </clipPath>
    <clipPath id="logo-clip-dark">
      <rect x="332" y="44" width="88" height="88" rx="20"/>
    </clipPath>
  </defs>

  <!-- Base Card -->
  <g clip-path="url(#card-clip-dark)">
    <rect x="2" y="2" width="1196" height="316" rx="20" fill="url(#bg-dark)"/>
    <rect x="2" y="2" width="1196" height="316" fill="url(#grid-dark)"/>
    <rect x="2" y="2" width="1196" height="316" fill="url(#glow-orange-dark)"/>
    <rect x="2" y="2" width="1196" height="316" fill="url(#glow-blue-dark)"/>
    <rect x="2" y="2" width="1196" height="316" fill="url(#glow-teal-dark)"/>

    <!-- Top gradient bar -->
    <rect x="2" y="2" width="1196" height="5" fill="url(#accent-bar-dark)"/>

    <!-- Decorative architectural lattice lines (left & right) -->
    <g opacity="0.28" stroke="#3B82F6" stroke-width="1.2" fill="none">
      <path d="M 36 86 L 96 54 L 154 96 L 114 156 L 44 146 Z"/>
      <path d="M 96 54 L 114 156 M 36 86 L 154 96"/>
      <circle cx="36" cy="86" r="4" fill="#F45D22" stroke="none"/>
      <circle cx="96" cy="54" r="4" fill="#2563EB" stroke="none"/>
      <circle cx="154" cy="96" r="4" fill="#0D9488" stroke="none"/>
      <circle cx="114" cy="156" r="4" fill="#2563EB" stroke="none"/>

      <path d="M 1046 92 L 1104 52 L 1164 88 L 1148 158 L 1076 150 Z"/>
      <path d="M 1104 52 L 1076 150 M 1046 92 L 1164 88"/>
      <circle cx="1046" cy="92" r="4" fill="#0D9488" stroke="none"/>
      <circle cx="1104" cy="52" r="4" fill="#2563EB" stroke="none"/>
      <circle cx="1164" cy="88" r="4" fill="#F45D22" stroke="none"/>
      <circle cx="1148" cy="158" r="4" fill="#0D9488" stroke="none"/>
    </g>
  </g>

  <!-- Outer Border -->
  <rect x="2" y="2" width="1196" height="316" rx="20" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Brand Lockup: OpenPaw Logo Badge + Badges + Wordmark -->
  <rect x="328" y="40" width="96" height="96" rx="24" fill="#1E293B" stroke="#F45D22" stroke-width="2"/>
  <image href="data:image/png;base64," x="332" y="44" width="88" height="88" clip-path="url(#logo-clip-dark)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Eyebrow pills row -->
  <rect x="444" y="44" width="128" height="26" rx="13" fill="#162033" stroke="#334155" stroke-width="1"/>
  <circle cx="460" cy="57" r="4" fill="#F45D22"/>
  <text x="513" y="61.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E2E8F0">CTU-OpenPaw</text>

  <rect x="582" y="44" width="76" height="26" rx="13" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
  <text x="620" y="61.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#93C5FD">v0.4.2</text>

  <rect x="668" y="44" width="196" height="26" rx="13" fill="#0D2D2A" stroke="#0D9488" stroke-width="1"/>
  <text x="766" y="61.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#5EEAD4">Pure-OSI · Apache-2.0</text>

  <!-- Main Wordmark -->
  <text x="444" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">Lattice<tspan fill="#F45D22">DX</tspan></text>

  <!-- Subtitle -->
  <text x="600" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0.2" fill="#CBD5E1">Open Enterprise Operating Platform — Pure-OSI Apache-2.0</text>

  <!-- 4 Metric / Pillar Chips -->
  <g>
    <rect x="119" y="228" width="174" height="42" rx="21" fill="#131C31" stroke="#283548" stroke-width="1.25"/>
    <circle cx="141" cy="249" r="5" fill="#2563EB"/>
    <text x="214.0" y="254" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#E2E8F0">6-Plane DX-OS</text>
  </g>
  <g>
    <rect x="309" y="228" width="214" height="42" rx="21" fill="#131C31" stroke="#283548" stroke-width="1.25"/>
    <circle cx="331" cy="249" r="5" fill="#0D9488"/>
    <text x="424.0" y="254" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#E2E8F0">7 Apache-2.0 Plugins</text>
  </g>
  <g>
    <rect x="539" y="228" width="212" height="42" rx="21" fill="#131C31" stroke="#283548" stroke-width="1.25"/>
    <circle cx="561" cy="249" r="5" fill="#10B981"/>
    <text x="653.0" y="254" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#E2E8F0">56 PG16 FORCE RLS</text>
  </g>
  <g>
    <rect x="767" y="228" width="314" height="42" rx="21" fill="#131C31" stroke="#283548" stroke-width="1.25"/>
    <circle cx="789" cy="249" r="5" fill="#F45D22"/>
    <text x="932.0" y="254" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#E2E8F0">AI Studio · Flow v2 · Digital Twin</text>
  </g>
</svg>
