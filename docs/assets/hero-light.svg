<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 248" width="1200" height="248" role="img" aria-label="LatticeDX v0.4.2 — Open Enterprise Operating Platform">
  <defs>
    <pattern id="grid-light" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E7E5E4" stroke-width="0.75" opacity="0.55"/>
    </pattern>
    <clipPath id="card-clip-light">
      <rect x="1" y="1" width="1198" height="246" rx="8"/>
    </clipPath>
    <clipPath id="logo-clip-light">
      <rect x="64" y="56" width="80" height="80" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-light)">
    <rect x="1" y="1" width="1198" height="246" fill="#FAFAF9"/>
    <rect x="1" y="1" width="1198" height="195" fill="url(#grid-light)"/>
    <rect x="1" y="196" width="1198" height="51" fill="#F2F0EA"/>
  </g>

  <rect x="1" y="1" width="1198" height="246" rx="8" fill="none" stroke="#E7E5E4" stroke-width="1"/>
  <line x1="1" y1="196" x2="1199" y2="196" stroke="#E7E5E4" stroke-width="1"/>
  <line x1="300" y1="196" x2="300" y2="247" stroke="#E7E5E4" stroke-width="1"/>
  <line x1="600" y1="196" x2="600" y2="247" stroke="#E7E5E4" stroke-width="1"/>
  <line x1="900" y1="196" x2="900" y2="247" stroke="#E7E5E4" stroke-width="1"/>

  <!-- OpenPaw Mark -->
  <rect x="56" y="48" width="96" height="96" rx="8" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="1"/>
  <image href="data:image/png;base64," x="64" y="56" width="80" height="80" clip-path="url(#logo-clip-light)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Editorial Header Copy -->
  <rect x="180" y="54" width="8" height="8" rx="1.5" fill="#D94E1F"/>
  <text x="198" y="62.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.2" fill="#AF4204">CTU-OPENPAW · PURE-OSI APACHE-2.0 · v0.4.2</text>

  <text x="180" y="118" font-family="'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#0C0A09">Lattice<tspan fill="#D94E1F">DX</tspan></text>

  <text x="180" y="150" font-family="'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif" font-size="16.5" font-weight="400" fill="#44403C">Open Enterprise Operating Platform — NocoBase 2.2.50, PG16 FORCE RLS, Flow v2 &amp; IIoT Twin</text>

  <!-- Minimal Architectural 3-Layer Glyph (Right) -->
  <g transform="translate(1036, 48)" fill="none" stroke-width="1.25" stroke-linejoin="round">
    <path d="M 54 12 L 100 32 L 54 52 L 8 32 Z" fill="#FFFFFF" stroke="#D94E1F"/>
    <path d="M 54 34 L 100 54 L 54 74 L 8 54 Z" fill="#FFFFFF" stroke="#2563EB"/>
    <path d="M 54 56 L 100 76 L 54 96 L 8 76 Z" fill="#F2F0EA" stroke="#78716C"/>
    <circle cx="54" cy="32" r="3" fill="#D94E1F" stroke="none"/>
    <circle cx="54" cy="54" r="3" fill="#2563EB" stroke="none"/>
    <circle cx="54" cy="76" r="3" fill="#047857" stroke="none"/>
  </g>

  <!-- Architectural Spec Footer -->
  <rect x="36" y="218" width="6" height="6" rx="1" fill="#D94E1F"/>
  <text x="52" y="225" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="0.5" fill="#44403C">6-PLANE DX-OS ARCHITECTURE</text>

  <rect x="336" y="218" width="6" height="6" rx="1" fill="#2563EB"/>
  <text x="352" y="225" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="0.5" fill="#44403C">7 APACHE-2.0 PLUGINS</text>

  <rect x="636" y="218" width="6" height="6" rx="1" fill="#047857"/>
  <text x="652" y="225" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="0.5" fill="#44403C">56 PG16 FORCE RLS TABLES</text>

  <rect x="936" y="218" width="6" height="6" rx="1" fill="#78716C"/>
  <text x="952" y="225" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="0.5" fill="#44403C">FLOW V2 · AI · IIOT</text>
</svg>
